# Antes: ./make-keys.sh, ./make-groups.sh <sedes...>, users.json y .env
services:
  control-server:
    image: ${CONTROL_SERVER_IMAGE:-control-server:local}
    build:
      context: .
    env_file: .env
    environment:
      CONTROL_BIND: 0.0.0.0:8090     # dentro del contenedor; el host lo publica en loopback
      CONTROL_GROUP_TOKENS: /app/data/groups.json
    command: ["sh", "-c", "if [ ! -e /app/data/groups.json ]; then cp /app/groups.json /app/data/groups.json && chmod 600 /app/data/groups.json; fi; exec python3 server.py"]
    volumes:
      - ./keys:/app/keys:ro
      - ./groups.json:/app/groups.json:ro
      - ./users.json:/app/users.json:ro
      - ./data:/app/data
    ports:
      - "8090:8090"        # poné nginx/caddy con TLS delante
    restart: unless-stopped

  auth:
    image: ${CONTROL_SERVER_IMAGE:-control-server:local}
    build:
      context: .
    command: ["python3", "auth-server.py"]
    env_file: .env
    environment:
      AUTH_BIND: 0.0.0.0:6666
      CONTROL_GROUP_TOKENS: /app/data/groups.json
    volumes:
      - ./groups.json:/app/groups.json:ro
      - ./users.json:/app/users.json:ro
      - ./data:/app/data
    ports:
      - "6666:6666"        # poné TLS delante (p. ej. login-teams.icpcbolivia.org)
    restart: unless-stopped
