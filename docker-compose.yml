# Infra del coordinador: control remoto + resolver DNS del concurso.
# APARTE del build del ISO (nada de esto entra al squashfs). Se levanta en el
# servidor nacional:  docker compose up -d
#
# Antes:  ./make-keys.sh
#         ./make-groups.sh lapaz sucre cbba ...     (o cp groups.json.example groups.json)
#         cp users.json.example users.json          (editar credenciales del login)
#         cp .env.example .env
services:
  control-server:
    build:
      context: .
    env_file: .env
    environment:
      CONTROL_BIND: 0.0.0.0:8090     # dentro del contenedor; el host lo publica en loopback
    volumes:
      - ./keys:/app/keys:ro
      - ./groups.json:/app/groups.json:ro
      - ./users.json:/app/users.json:ro
      - ./data:/app/data
    ports:
      - "8090:8090"        # poné nginx/caddy con TLS delante
    restart: unless-stopped

  auth:
    # Login del concurso (lo que consulta la ISO en AUTH_SERVICE_URL). Valida
    # contra users.json; el enrollToken de cada sede sale de groups.json.
    build:
      context: .
    command: ["python3", "auth-server.py"]
    env_file: .env
    environment:
      AUTH_BIND: 0.0.0.0:6666
    volumes:
      - ./groups.json:/app/groups.json:ro
      - ./users.json:/app/users.json:ro
      - ./data:/app/data
    ports:
      - "6666:6666"        # poné TLS delante (p. ej. login-teams.icpcbolivia.org)
    restart: unless-stopped

  dns:
    # Resolver de caché. Su IP pública va en NET_DNS_SERVERS (config/iso.conf).
    # OJO: resolver abierto; en el server limitá el puerto 53 a las IPs de las
    # sedes con firewall/VPN. Opcional: si NET_DNS_SERVERS apunta directo a
    # 1.1.1.1/8.8.8.8 no hace falta este servicio.
    build:
      context: .
      dockerfile: dns/Dockerfile
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    mem_limit: 128m                  # dnsmasq real usa ~15-40 MB con este cache-size
    restart: unless-stopped

  ntp:
    # Servidor NTP para las máquinas del concurso. Su IP pública va en
    # NET_NTP_SERVERS (config/iso.conf); si está vacío la ISO cae a
    # NET_DNS_SERVERS, así que suele ser el mismo host que el resolver.
    # OJO: igual que el DNS, limitá el puerto 123 a las IPs de las sedes.
    build:
      context: .
      dockerfile: ntp/Dockerfile
    ports:
      - "123:123/udp"
    mem_limit: 64m
    restart: unless-stopped
