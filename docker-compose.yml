# Antes: ./make-keys.sh, ./make-groups.sh <sedes...>, users.json y .env
services:
  control-server:
    build:
      context: .
    env_file: .env
    environment:
      CONTROL_BIND: 0.0.0.0:8090     # dentro del contenedor; el host lo publica en loopback
    volumes:
      - ./keys:/app/keys:ro
      - ./groups.json:/app/groups.json:ro
      - ./users.json:/app/users.json:ro
      - ./data:/app/data
    ports:
      - "8090:8090"        # poné nginx/caddy con TLS delante
    restart: unless-stopped

  auth:
    build:
      context: .
    command: ["python3", "auth-server.py"]
    env_file: .env
    environment:
      AUTH_BIND: 0.0.0.0:6666
    volumes:
      - ./groups.json:/app/groups.json:ro
      - ./users.json:/app/users.json:ro
      - ./data:/app/data
    ports:
      - "6666:6666"        # poné TLS delante (p. ej. login-teams.icpcbolivia.org)
    restart: unless-stopped
