# Resolver DNS de caché para las máquinas del concurso (nivel nacional).
# La ISO fija NET_DNS_SERVERS a este servidor y bloquea todo otro DNS, así que
# esto solo tiene que reenviar nombres públicos (login.codi.com.bo,
# stats.codi.com.bo, y los hosts de UPDATE/CONTROL) y cachearlos.
port=53
no-resolv          # ignora /etc/resolv.conf del contenedor
no-hosts           # ignora /etc/hosts del contenedor
no-poll

# Upstreams públicos
server=1.1.1.1
server=8.8.8.8
server=9.9.9.9

# Caché
cache-size=10000
min-cache-ttl=60
neg-ttl=60

# Higiene
domain-needed
bogus-priv
stop-dns-rebind

# Si el DNS público de codi.com.bo llega a fallar durante el concurso,
# descomentá y poné las IPs reales para servirlas de forma fija:
#address=/login.codi.com.bo/0.0.0.0
#address=/stats.codi.com.bo/0.0.0.0

log-facility=-
#log-queries=extra   # ruidoso con cientos de máquinas; solo para depurar
