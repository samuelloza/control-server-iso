# Servidor NTP para las máquinas del concurso (nivel nacional). La ISO fija
# NET_NTP_SERVERS a este servidor y bloquea todo otro
# NTP, así que esto solo tiene que sincronizar de upstreams públicos y servir.

pool pool.ntp.org iburst
server time.cloudflare.com iburst
server time.google.com iburst

# Servir a cualquiera; el acceso real se limita con firewall a las IPs de las
# sedes.
allow all

# Si los upstreams caen durante el concurso, seguí sirviendo la hora local en
# vez de dejar a las máquinas sin sync.
local stratum 10

driftfile /var/lib/chrony/drift
logdir /var/log/chrony
