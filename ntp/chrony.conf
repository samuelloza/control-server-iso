# NTP para las maquinas del concurso (NET_NTP_SERVERS en la ISO)

pool pool.ntp.org iburst
server time.cloudflare.com iburst
server time.google.com iburst

# el acceso se limita con firewall
allow all

# si se cae internet, seguir sirviendo la hora local
local stratum 10

driftfile /var/lib/chrony/drift
logdir /var/log/chrony
